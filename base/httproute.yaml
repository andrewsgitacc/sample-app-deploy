# https://sample-app-<stage>.apps.lab.local via the shared lab-gateway (hostname set per stage).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sample-app
spec:
  parentRefs:
    - name: lab-gateway
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - sample-app.apps.lab.local
  rules:
    - backendRefs:
        - name: sample-app
          port: 80
