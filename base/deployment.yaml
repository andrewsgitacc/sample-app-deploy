apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-app
  labels: {app: sample-app}
spec:
  replicas: 1
  selector:
    matchLabels: {app: sample-app}
  template:
    metadata:
      labels: {app: sample-app}
    spec:
      # Harbor project sample-app is private: robot$sample-app+kargo (pull only), sealed
      # into each stage namespace by platform-gitops scripts/seal-kargo-secrets.sh.
      imagePullSecrets:
        - name: harbor-pull
      # The image's USER is "nonroot" (a name), which the kubelet can't check against
      # runAsNonRoot - so give distroless's nonroot UID/GID (65532) explicitly.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: sample-app
          image: harbor.apps.lab.local/sample-app/sample-app
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: APP_ENV
              value: base     # set per stage
          readinessProbe:
            httpGet: {path: /healthz, port: http}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
