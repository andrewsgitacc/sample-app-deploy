apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sample-app
  namespace: sample-app-dev
spec:
  hostnames:
  - sample-app-dev.apps.lab.local
  parentRefs:
  - name: lab-gateway
    namespace: envoy-gateway-system
    sectionName: https
  rules:
  - backendRefs:
    - name: sample-app
      port: 80
