# Stage prod: namespace sample-app-prod, https://sample-app-prod.apps.lab.local
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: sample-app-prod
resources:
  - ../../base
patches:
  - target: {kind: Deployment, name: sample-app}
    patch: |
      - op: replace
        path: /spec/replicas
        value: 2
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: prod
  - target: {kind: HTTPRoute, name: sample-app}
    patch: |
      - op: replace
        path: /spec/hostnames/0
        value: sample-app-prod.apps.lab.local
